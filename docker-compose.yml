services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: "http://qdrant:6333"
      TENANTQ_COLLECTION: "tenantq"
      TENANTQ_METRICS_PORT: "8001"
      TENANTQ_EMBEDDER: "fastembed"
    ports:
      - "8001:8001"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

volumes:
  qdrant_storage:
